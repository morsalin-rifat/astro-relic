name: Build Offline Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: oven-sh/setup-bun@v2

      - name: Install game packages
        run: bun install

      - name: Build offline game (all audio, video, images, 3D models bundled)
        run: bunx --bun vite build --config vite.apk.config.ts

      - name: Create Android app
        env:
          CI: "true"
          CAPACITOR_TELEMETRY: "false"
        run: |
          set -o pipefail
          run() { "$@" > step.log 2>&1 || { echo "::error title=Failed: $*::$(tail -c 3000 step.log | tr '\n' ' ')"; cat step.log; exit 1; }; cat step.log; }
          test -f dist/client/index.html || { echo "::error::dist/client/index.html missing"; exit 1; }
          run ./node_modules/.bin/cap telemetry off
          run ./node_modules/.bin/cap add android
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          run ./node_modules/.bin/cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon > gradle.log 2>&1 || { echo "::error title=Gradle failed::$(grep -iE 'error|wrong|failed' gradle.log | tail -n 15 | tr '\n' ' ')"; tail -n 80 gradle.log; exit 1; }
          cp app/build/outputs/apk/debug/app-debug.apk ../AstroRelic.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AstroRelic-APK
          path: AstroRelic.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Astro Relic - Offline Android APK
          body: Download AstroRelic.apk, install on Android, and play fully offline.
          files: AstroRelic.apk
          make_latest: true
